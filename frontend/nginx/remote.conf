# Static server for one microfrontend, served under /mfe/<name>/.
server {
	listen 8080;
	server_name _;
	server_tokens off;
	root /usr/share/nginx/html;

	location ~ /remoteEntry\.js$ {
		add_header Cache-Control "no-cache";
		try_files $uri =404;
	}

	location /mfe/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	location / {
		return 404;
	}
}
