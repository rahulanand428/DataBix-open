# Static server for the shell (inside its own container, behind the edge proxy).
server {
	listen 8080;
	server_name _;
	server_tokens off;
	root /usr/share/nginx/html;

	# Hashed build assets never change.
	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# Manifest and entry points must be revalidated so new deploys are picked up.
	location ~ ^/(remotes\.json|theme-init\.js|favicon\.svg)$ {
		add_header Cache-Control "no-cache";
		try_files $uri =404;
	}

	# Client-side routes fall back to the app shell.
	location / {
		add_header Cache-Control "no-cache";
		try_files $uri /index.html;
	}
}
