server_tokens off;

# The API accepts only small JSON and form bodies (login, signup).
client_max_body_size 16k;
client_body_timeout 10s;
client_header_timeout 10s;

# Per-client-IP request limits. Behind another load balancer, configure
# real_ip_module so $remote_addr is the end client, not the balancer (this also
# makes the X-Forwarded-For sent to the API correct).
limit_req_zone $binary_remote_addr zone=databix_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=databix_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=databix_assistant:10m rate=6r/m;
limit_req_status 429;

# HSTS only makes sense (and is only honoured) on HTTPS responses.
map $scheme $databix_hsts {
	https "max-age=63072000";
	default "";
}

upstream fastapi_backend {
	server backend:8000;
}

# Resolve microfrontend containers through Docker's DNS at request time, so the
# proxy starts even while a web container is being redeployed.
resolver 127.0.0.11 valid=10s ipv6=off;
