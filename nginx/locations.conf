# nginx is the edge proxy: X-Forwarded-For is overwritten with the connecting
# address rather than appended to, so clients cannot inject forged entries.
# $http_host keeps a non-default port, so backend redirects stay correct.

# Login and signup: slow enough to make password guessing impractical.
location /api/v1/auth/ {
	limit_req zone=databix_auth burst=5 nodelay;
	include /etc/nginx/databix/proxy_api.conf;
}

# Session refresh and logout are not password checks; normal API limits apply.
location ~ ^/api/v1/auth/(refresh|logout)$ {
	limit_req zone=databix_api burst=40 nodelay;
	include /etc/nginx/databix/proxy_api.conf;
}

# The AI assistant calls an external model: tight per-client limit, longer timeout.
location /api/v1/assistant/ {
	limit_req zone=databix_assistant burst=3 nodelay;
	# Questions carry up to ten turns of history.
	client_max_body_size 64k;
	proxy_read_timeout 120s;
	include /etc/nginx/databix/proxy_api.conf;
}

# Branding uploads carry a logo (up to 200 KB, base64-encoded in JSON).
location = /api/v1/admin/branding {
	client_max_body_size 512k;
	limit_req zone=databix_api burst=10 nodelay;
	include /etc/nginx/databix/proxy_api.conf;
}

location /api/ {
	limit_req zone=databix_api burst=40 nodelay;
	include /etc/nginx/databix/proxy_api.conf;
}

location ~ ^/(health|docs|redoc|openapi\.json)$ {
	limit_req zone=databix_api burst=40 nodelay;
	include /etc/nginx/databix/proxy_api.conf;
}

# Web UI: the shell and one container per microfrontend (independently deployable).
include /etc/nginx/databix/web.conf;
