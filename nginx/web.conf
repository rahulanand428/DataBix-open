# A location with its own add_header no longer inherits the server's headers,
# so each one repeats HSTS (empty, hence omitted, on plain HTTP).
#
# Upstreams are variables so nginx resolves them per request (resolver in
# common.conf): one microfrontend can be redeployed without restarting the edge.
#
# Content-Security-Policy for the web UI: everything same-origin, no inline
# scripts, no third-party fonts or analytics. Inline styles are allowed for
# chart layout and the runtime theme variables.
set $databix_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

location /mfe/overview/ {
	set $web_upstream http://web_overview:8080;
	add_header Content-Security-Policy $databix_csp always;
	add_header Strict-Transport-Security $databix_hsts always;
	proxy_pass $web_upstream;
}
location /mfe/explorer/ {
	set $web_upstream http://web_explorer:8080;
	add_header Content-Security-Policy $databix_csp always;
	add_header Strict-Transport-Security $databix_hsts always;
	proxy_pass $web_upstream;
}
location /mfe/symbols/ {
	set $web_upstream http://web_symbols:8080;
	add_header Content-Security-Policy $databix_csp always;
	add_header Strict-Transport-Security $databix_hsts always;
	proxy_pass $web_upstream;
}
location /mfe/assistant/ {
	set $web_upstream http://web_assistant:8080;
	add_header Content-Security-Policy $databix_csp always;
	add_header Strict-Transport-Security $databix_hsts always;
	proxy_pass $web_upstream;
}
location /mfe/admin/ {
	set $web_upstream http://web_admin:8080;
	add_header Content-Security-Policy $databix_csp always;
	add_header Strict-Transport-Security $databix_hsts always;
	proxy_pass $web_upstream;
}
location / {
	limit_req zone=databix_api burst=40 nodelay;
	add_header Content-Security-Policy $databix_csp always;
	add_header Strict-Transport-Security $databix_hsts always;
	add_header X-Content-Type-Options nosniff always;
	add_header X-Frame-Options DENY always;
	add_header Referrer-Policy no-referrer always;
	set $web_upstream http://web_shell:8080;
	proxy_pass $web_upstream;
}
