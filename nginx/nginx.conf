# HTTP-only configuration. Compose binds it to loopback by default; for any
# network-facing deployment use docker-compose.tls.yml (nginx/nginx.tls.conf).
events {}

http {
	include /etc/nginx/databix/common.conf;

	server {
		listen 80;
		server_name _;

		include /etc/nginx/databix/locations.conf;
	}
}
