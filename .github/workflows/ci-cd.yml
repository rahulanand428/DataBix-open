name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  # Weekly run so newly published vulnerabilities in locked dependencies are
  # caught even when nobody pushes.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-only-test-signing-key-not-for-deployment
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run tests
        run: python -m pytest -q

      - name: Generate throwaway Compose secrets
        run: |
          for name in POSTGRES_PASSWORD POSTGRES_APP_PASSWORD MONGO_ROOT_PASSWORD MONGO_APP_PASSWORD REDIS_PASSWORD GRAFANA_ADMIN_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::${value}"
            echo "${name}=${value}" >> "$GITHUB_ENV"
          done

      - name: Validate Docker Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.tls.yml config --quiet

      - name: Build and start Docker Compose stack
        run: docker compose up --build --detach

      - name: Check backend health
        run: |
          # --retry-all-errors also covers connection resets while a container is
          # published but its server is not listening yet.
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://localhost:8000/health
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://localhost/health

      - name: Check backend logs reach Loki through the Docker socket proxy
        run: |
          for attempt in $(seq 1 36); do
            if docker compose exec -T backend python - <<'PY'
          import json, sys, urllib.parse, urllib.request
          query = urllib.parse.urlencode({"query": '{service="fastapi-service"}', "limit": "1"})
          with urllib.request.urlopen(f"http://loki:3100/loki/api/v1/query_range?{query}") as response:
              sys.exit(0 if json.load(response)["data"]["result"] else 1)
          PY
            then
              echo "Backend logs are arriving in Loki"
              exit 0
            fi
            sleep 5
          done
          echo "No backend logs in Loki after 3 minutes"
          docker compose logs --tail 50 docker_socket_proxy alloy
          exit 1

      - name: Smoke-test admin login, ingestion and queries through nginx
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::${password}"
          echo "${password}" | docker compose exec -T backend python -m auth.manage create-user ci-admin --admin
          token="$(curl --fail --silent --show-error http://localhost/api/v1/auth/token \
            --data-urlencode username=ci-admin --data-urlencode "password=${password}" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])')"
          echo "::add-mask::${token}"
          # Exercises the least-privilege PostgreSQL role, the MongoDB app user and Redis auth.
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${token}" \
            http://localhost/api/v1/short-selling/ingest \
            | python3 -c 'import json, sys; r = json.load(sys.stdin); print(r); assert r["mongo_rows"] > 0 and r["postgres_rows"] > 0'
          curl --fail --silent --show-error -H "Authorization: Bearer ${token}" \
            "http://localhost/api/v1/short-selling?limit=1" \
            | python3 -c 'import json, sys; r = json.load(sys.stdin); print("total rows:", r["total"]); assert r["total"] > 0'

      - name: Show container status on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --tail 50

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install audit tooling
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Audit locked dependencies for known vulnerabilities
        run: |
          pip-audit --requirement requirements.lock --requirement requirements-dev.lock \
            --require-hashes --disable-pip --progress-spinner off

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [test, dependency-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
